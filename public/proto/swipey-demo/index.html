/* Vendored-embed seed. In the source app the onboarding variants this case
   study is about (diegetic questions, mad-libs identity, industry-seeded
   toasts, persona fork, finale) ship default-off behind the ?lab dev panel,
   and the tour writes "0" the moment a visitor hits Skip. The embed must open
   on the designed experience every time, so the flags are set here — before
   the deferred bundle runs — instead of patching the minified bundle or the
   source repo. "scorecard" stays off: it ends in an email capture with no
   backend on this host. Read by src/modules/GetStarted/sandbox/onboarding/tourStore.ts. */
try {
  localStorage.setItem("swipey_demo_tour_enabled", "1");
  localStorage.setItem("swipey_demo_qualify_enabled", "1");
  localStorage.setItem("swipey_demo_variants", JSON.stringify({
    diegetic: true, personalize: true, madlibs: true, persona: true,
    finale: true, scorecard: false
  }));
} catch (e) { /* private mode — demo still runs on its own defaults */ }
