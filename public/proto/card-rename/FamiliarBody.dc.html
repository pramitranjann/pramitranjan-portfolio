<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div>
  <sc-if value="{{ withCard }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;gap:14px;padding:16px 20px;border-bottom:1px solid var(--swipey-mint-soft)">
      <div style="width:200px;height:126px;flex-shrink:0">
        <div style="width:340px;height:214px;transform:scale(0.5882);transform-origin:top left">
          <dc-import name="SwipeyCardArt" card-name="{{ cardName }}" hint-size="340px,214px" style="display:block"></dc-import>
        </div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;min-width:0">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--neutral-200)"><span style="font:400 13px/20px var(--font-body);color:var(--fg-secondary)">Status</span><span style="background:#EEFAF1;color:#30BC53;font:600 11px/1 var(--font-ui);border-radius:9999px;padding:3px 10px">Active</span></div>
        <div style="display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--neutral-200)"><span style="font:400 13px/20px var(--font-body);color:var(--fg-secondary)">Add funds</span><button style="background:var(--swipey-navy);color:white;border:none;border-radius:8px;padding:5px 11px;font:600 12px var(--font-ui);cursor:pointer;display:flex;align-items:center;gap:4px">Topup <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button></div>
        <div style="display:flex;align-items:center;justify-content:space-between;padding:7px 0"><span style="font:400 13px/20px var(--font-body);color:var(--fg-secondary)">Customise</span><button style="background:none;border:1px solid var(--neutral-200);border-radius:8px;padding:5px 11px;font:600 12px var(--font-ui);cursor:pointer;color:var(--fg-primary);display:flex;align-items:center;gap:4px">Settings <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg></button></div>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ noCard }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;padding:4px 20px 0">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--neutral-200)"><span style="font:400 13px/20px var(--font-body);color:var(--fg-secondary)">Status</span><span style="background:#EEFAF1;color:#30BC53;font:600 11px/1 var(--font-ui);border-radius:9999px;padding:3px 10px">Active</span></div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--neutral-200)"><span style="font:400 13px/20px var(--font-body);color:var(--fg-secondary)">Add funds</span><button style="background:var(--swipey-navy);color:white;border:none;border-radius:8px;padding:5px 11px;font:600 12px var(--font-ui);cursor:pointer;display:flex;align-items:center;gap:4px">Topup <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button></div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--swipey-mint-soft)"><span style="font:400 13px/20px var(--font-body);color:var(--fg-secondary)">Customise</span><button style="background:none;border:1px solid var(--neutral-200);border-radius:8px;padding:5px 11px;font:600 12px var(--font-ui);cursor:pointer;color:var(--fg-primary);display:flex;align-items:center;gap:4px">Settings <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg></button></div>
    </div>
  </sc-if>
  <div style="padding:11px 20px;border-bottom:1px solid var(--swipey-mint-soft);font:400 13px/20px var(--font-body);color:var(--fg-secondary)">Daily spending limit <strong style="color:var(--fg-primary);font-weight:700">RM 50,000.00</strong></div>
  <div style="margin:14px 20px;background:var(--swipey-mint);border-radius:12px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px">
    <div style="flex:1">
      <div style="display:flex;align-items:center;gap:7px;margin-bottom:4px"><span style="font:700 13px/18px var(--font-display);color:var(--swipey-navy)">Activate auto top up!</span><span style="background:var(--swipey-navy);color:white;font:700 8px var(--font-ui);border-radius:9999px;padding:2px 6px;letter-spacing:.06em">NEW</span></div>
      <span style="font:400 11px/16px var(--font-body);color:var(--swipey-navy);opacity:.7">Automatically top up your card when balance is low.</span>
    </div>
    <button style="background:var(--swipey-navy);color:white;border:none;border-radius:8px;padding:8px 13px;font:600 12px var(--font-ui);cursor:pointer;display:flex;align-items:center;gap:5px;flex-shrink:0;white-space:nowrap">Activate <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button>
  </div>
  <div style="padding:0 20px 24px">
    <div style="font:700 14px/20px var(--font-display);color:var(--fg-primary);margin-bottom:16px">Recent Transactions</div>
    <div style="display:flex;flex-direction:column;align-items:center;padding:20px 0 8px;gap:9px">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#C0EEE4" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" style="display:block"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
      <div style="font:700 13px/18px var(--font-display);color:var(--fg-secondary);text-align:center">Make your first transaction today!</div>
      <div style="font:400 12px/17px var(--font-body);color:var(--fg-tertiary);text-align:center">Swipey makes it easier than ever.</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 460, &quot;height&quot;: 400 },
  &quot;cardName&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Pramit Ranjan 2&quot;, &quot;tsType&quot;: &quot;string&quot; }
}">class Component extends DCLogic {
  renderVals() {
    const w = this.props.withCard ?? true;
    return { withCard: w, noCard: !w, cardName: this.props.cardName ?? 'Pramit Ranjan 2' };
  }
}</script>
</body>
</html>
