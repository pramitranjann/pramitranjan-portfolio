<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div>
  <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 16px 20px 14px; padding-top: 25px">
    <button style="display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 8px;background:var(--swipey-navy);border:none;border-radius:12px;cursor:pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2" strokeLinecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      <span style="font:600 12px var(--font-ui);color:white">Top up</span>
    </button>
    <button style="display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 8px;background:white;border:1px solid var(--swipey-mint-soft);border-radius:12px;cursor:pointer" style-hover="background:var(--swipey-mint-light)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--swipey-navy)" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><line x1="2" y1="12" x2="22" y2="12"></line><line x1="12" y1="2" x2="12" y2="22"></line><path d="m20 16-4-4 4-4"></path><path d="m4 8 4 4-4 4"></path><path d="m16 4-4 4-4-4"></path><path d="m8 20 4-4 4 4"></path></svg>
      <span style="font:600 12px var(--font-ui);color:var(--swipey-navy)">Freeze</span>
    </button>
    <button style="display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 8px;background:white;border:1px solid var(--swipey-mint-soft);border-radius:12px;cursor:pointer" style-hover="background:var(--swipey-mint-light)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--swipey-navy)" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 14 4 9 9 4"></polyline><path d="M20 20v-7a4 4 0 0 0-4-4H4"></path></svg>
      <span style="font:600 12px var(--font-ui);color:var(--swipey-navy)">Clawback</span>
    </button>
  </div>
  <div style="padding:0 20px 14px;border-bottom:1px solid var(--swipey-mint-soft);font:400 13px/20px var(--font-body);color:var(--fg-secondary)">Daily spending limit <strong style="color:var(--fg-primary);font-weight:700">RM 50,000.00</strong></div>
  <div style="margin:14px 20px;background:var(--swipey-mint);border-radius:12px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px">
    <div style="flex:1">
      <div style="display:flex;align-items:center;gap:7px;margin-bottom:4px"><span style="font:700 13px/18px var(--font-display);color:var(--swipey-navy)">Activate auto top up!</span><span style="background:var(--swipey-navy);color:white;font:700 8px var(--font-ui);border-radius:9999px;padding:2px 6px;letter-spacing:.06em">NEW</span></div>
      <span style="font:400 11px/16px var(--font-body);color:var(--swipey-navy);opacity:.7">Automatically top up your card when balance is low.</span>
    </div>
    <button style="background:var(--swipey-navy);color:white;border:none;border-radius:8px;padding:8px 13px;font:600 12px var(--font-ui);cursor:pointer;display:flex;align-items:center;gap:5px;flex-shrink:0;white-space:nowrap">Activate <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg></button>
  </div>
  <div style="padding:0 20px 24px">
    <div style="font:700 14px/20px var(--font-display);color:var(--fg-primary);margin-bottom:16px">Recent Transactions</div>
    <div style="display:flex;flex-direction:column;align-items:center;padding:20px 0 8px;gap:9px">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#C0EEE4" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" style="display:block"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
      <div style="font:700 13px/18px var(--font-display);color:var(--fg-secondary);text-align:center">Make your first transaction today!</div>
      <div style="font:400 12px/17px var(--font-body);color:var(--fg-tertiary);text-align:center">Swipey makes it easier than ever.</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
